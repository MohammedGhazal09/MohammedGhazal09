name: DOMHamster external WP00 GREEN verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/domhamster-target-verify.yml
      - domhamster-target-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - name: Clone the public DOMHamster WP00 branch
        run: |
          git clone --depth 1 --branch implementation/wp00-toolchain \
            https://github.com/MohammedGhazal09/DOMHamster.git domhamster-target
          git -C domhamster-target rev-parse HEAD | tee domhamster-target/source-sha.txt
          test "$(cat domhamster-target/source-sha.txt)" = "c4bcf3613a46921e307986fdcdeaa146e22096f9"

      - name: Verify runtime
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"

      - name: Install committed dependency graph
        working-directory: domhamster-target
        run: npm ci --ignore-scripts

      - name: Verify dependency policy
        working-directory: domhamster-target
        run: node scripts/verify-exact-dependencies.mjs

      - name: Audit dependency graph
        working-directory: domhamster-target
        run: npm audit --audit-level=high --json > npm-audit.json

      - name: Verify static toolchain contracts
        working-directory: domhamster-target
        run: node --test tests/toolchain/wp00-contract.test.mjs

      - name: Verify formatting
        working-directory: domhamster-target
        run: npm run format:check

      - name: Verify lint
        working-directory: domhamster-target
        run: npm run lint

      - name: Verify types
        working-directory: domhamster-target
        run: npm run typecheck

      - name: Verify complete Vitest suite
        working-directory: domhamster-target
        run: npm run test:run

      - name: Verify production build
        working-directory: domhamster-target
        run: npm run build

      - name: Install Chromium
        working-directory: domhamster-target
        run: npx playwright install --with-deps chromium

      - name: Verify browser smoke test
        working-directory: domhamster-target
        run: npm run test:e2e

      - name: Upload target GREEN evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: domhamster-target-wp00-green
          path: |
            domhamster-target/source-sha.txt
            domhamster-target/package.json
            domhamster-target/package-lock.json
            domhamster-target/npm-audit.json
            domhamster-target/dist/
            domhamster-target/playwright-report/
            domhamster-target/test-results/
          if-no-files-found: warn
          retention-days: 7
