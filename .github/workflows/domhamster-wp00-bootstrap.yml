name: DOMHamster WP01 RED

on:
  push:
    branches:
      - domhamster-wp00-bootstrap-20260826
    paths:
      - domhamster-bootstrap/**
      - .github/workflows/domhamster-wp00-bootstrap.yml

permissions:
  contents: read

jobs:
  fixture-red:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domhamster-bootstrap
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Verify runtime
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
      - name: Install verified dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Observe expected missing fixture module
        run: |
          set +e
          npm run test:run -- tests/domain/seed.test.ts > vitest-wp01-red.log 2>&1
          status=$?
          set -e
          cat vitest-wp01-red.log
          test "$status" -ne 0
          grep -F "src/domain/seed" vitest-wp01-red.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: domhamster-wp01-red
          path: domhamster-bootstrap/vitest-wp01-red.log
          if-no-files-found: error
          retention-days: 7
