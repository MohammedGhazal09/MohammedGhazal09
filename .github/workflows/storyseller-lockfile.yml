name: Generate StorySeller lockfile

on:
  push:
    branches: [automation/storyseller-lockfile]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: storieseller-lockfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched framework versions
        run: |
          node -e "const lock=require('./package-lock.json'); if (lock.packages['node_modules/next'].version !== '16.2.11') process.exit(1)"
          node -e "const lock=require('./package-lock.json'); if (lock.packages['node_modules/eslint-config-next'].version !== '16.2.11') process.exit(1)"
      - name: Upload lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storieseller-package-lock
          path: storieseller-lockfile/package-lock.json
          retention-days: 1
